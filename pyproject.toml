[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timetravel3d"
version = "0.1.0"
description = "Confidence-aware sparse reconstruction with calibrated multi-view geometry"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.8,<5", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "PyYAML>=6,<7", "plyfile>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
timetravel3d = "timetravel3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
